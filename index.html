<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Loop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            user-select: none;
        }
        .fullscreen-media {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            pointer-events: none; /* Prevents interaction with GIF */
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="overlay" class="overlay">
        <button id="start-btn" class="bg-white text-black px-8 py-4 rounded-full font-bold text-xl hover:bg-gray-200 transition-all shadow-lg cursor-pointer">
            Click for surprise
        </button>
    </div>

    <img id="surprise-img" 
         src="./image.gif" 
         alt="Background GIF" 
         class="fullscreen-media hidden">

    <audio id="background-audio">
        <source src="./sound.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const audio = document.getElementById('background-audio');
        const img = document.getElementById('surprise-img');

        // Monitor time to loop specifically at 18 seconds
        audio.addEventListener('timeupdate', () => {
            if (audio.currentTime >= 18) {
                audio.currentTime = 0;
                audio.play();
            }
        });

        startBtn.addEventListener('click', () => {
            // Request Fullscreen
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => console.log(err));
            }

            // Lock Pointer
            if (elem.requestPointerLock) {
                elem.requestPointerLock();
            }

            audio.play().catch(e => console.error("Playback failed:", e));
            overlay.style.display = 'none';
            img.classList.remove('hidden');
        });
    </script>
</body>
</html>
